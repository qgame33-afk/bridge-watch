name: Bridge watch

# Checks ship positions every 10 minutes and sends a phone alert for any
# large ship about an hour from the Ambassador Bridge.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   AISSTREAM_API_KEY   the free key from aisstream.io
#   TELEGRAM_BOT_TOKEN  the Telegram bot that sends the alerts (Vessel Agent)
#   TELEGRAM_CHAT_ID    the Telegram chat the alerts go to
#   NTFY_TOPIC          old route; used only while the two Telegram secrets
#                       are not set
#
# The repo is public, so these runs are free. In a private repo this schedule
# would use far more than the 2,000 free minutes a month.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Diagnostic: listen for 2 minutes and list the ships heard (sends no alerts)'
        type: boolean
        default: false

concurrency:
  group: bridge-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ship lengths and recent alerts carry over from the previous run.
      - uses: actions/cache/restore@v4
        with:
          path: ships-cache.json
          key: ships-cache-${{ github.run_id }}
          restore-keys: ships-cache-

      - if: ${{ inputs.probe }}
        run: node bridge-watch.js --probe
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          LISTEN_SECONDS: 120

      - if: ${{ !inputs.probe }}
        run: node bridge-watch.js --once
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # The feed hears each ship only about once a minute here, so listen
          # long enough to catch every ship and its length broadcast.
          LISTEN_SECONDS: 270
          # Runs can start late, so alert for ships up to 60 + 30 minutes
          # from the bridge.
          LOOKAHEAD_MINUTES: 30

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ships-cache.json
          key: ships-cache-${{ github.run_id }}
